# ============================================
# Docker Compose - Microservicio
# Uso: docker compose up -d
# ============================================
services:
  api:
    build: .
    container_name: microservicio-pedidos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/database/app.db
      LOG_LEVEL: combined
      CORS_ORIGIN: "*"
    volumes:
      - db-data:/app/database
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
